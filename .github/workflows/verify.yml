name: Verify workspace

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
          cache: npm
      - run: npm ci
      - name: Compare explicit revisions
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        shell: bash
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}"; then
            base="$(git rev-parse "$HEAD^")"
          fi
          echo "NX_BASE=$base" >> "$GITHUB_ENV"
          echo "NX_HEAD=$HEAD" >> "$GITHUB_ENV"
      - run: npm exec -- nx affected -t lint check test build --base="$NX_BASE" --head="$NX_HEAD"
      - name: Verify migration with all consumers and emitted runtime
        env:
          NX_SKIP_NX_CACHE: 'true'
        run: |
          npm run verify
          node scripts/verify-compiled.mjs
          node scripts/verify-migration-equivalence.mjs
      - name: Validate boundary violations and the browser declaration graph
        run: node scripts/verify-boundaries.mjs
      - name: Verify repeated local cached build
        run: npm run build
      - name: Isolated MongoDB integration
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true&replicaSet=rs0
        run: |
          docker run --detach --name sidechannel-ci-mongo --publish 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            docker exec sidechannel-ci-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' && break
            sleep 1
          done
          docker exec sidechannel-ci-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in $(seq 1 30); do
            docker exec sidechannel-ci-mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)' && break
            sleep 1
          done
          npm run test:integration
